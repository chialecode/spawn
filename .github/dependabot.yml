version: 2
# Version updates wait 7 days after upstream release (cooldown) and are reviewed
# together at stage boundaries (see docs/dev-rules/quality-gates.md).
# Security advisories bypass the cooldown automatically.
# All GitHub Actions references in workflows are pinned to full 40-char commit SHAs.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      compatible:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore(ci)
