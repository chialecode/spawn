name: CI

# The only required check of the `main-protection` ruleset. Keep the job name
# `repository-quality` in exact sync with .github/rulesets/main.json
# (`required_status_checks`: context = "repository-quality", integration_id = 15368).
# No path filters: documentation-only PRs must produce this check too.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs only; a running main run is never cancelled (GitHub may still
  # replace a queued main run with a newer one, so not every push to main gets its own run).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-quality:
    name: repository-quality
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      PYTHONIOENCODING: utf-8
    # pwsh only reports the last command of a multi-line step; bash runs with -eo pipefail.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify DCO Signed-off-by trailers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(["git", *args], encoding="utf-8")

          event = os.environ.get("EVENT_NAME", "")
          base = os.environ.get("BASE_SHA", "")
          head = os.environ.get("HEAD_SHA", "")
          dco_re = re.compile(r"^Signed-off-by:\s+.+\s+<[^@\s]+@[^@\s]+>\s*$", re.MULTILINE)

          if event == "pull_request" and base and head:
              revs = git("rev-list", "--no-merges", f"{base}..{head}").splitlines()
          else:
              revs = [git("rev-parse", "HEAD").strip()]

          if not revs:
              print("No commits found to verify DCO.", file=sys.stderr)
              sys.exit(1)

          missing = [rev for rev in revs if not dco_re.search(git("log", "-1", "--format=%B", rev))]
          if missing:
              print("Missing valid DCO Signed-off-by trailer in commit(s):", ", ".join(missing), file=sys.stderr)
              sys.exit(1)

          print(f"DCO Signed-off-by verified for {len(revs)} commit(s).")
          PY

      - name: Verify documentation governance and whitespace hygiene
        run: |
          python -B scripts/check_docs.py
          git diff --check

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # After setup-dotnet: the signing round-trip test runs scripts/sign_update.cs on the pinned SDK.
      - name: Release tooling unit tests (offline)
        run: python -B scripts/test_release.py

      - name: Packaging tooling unit tests (offline)
        run: python -B scripts/test_package.py

      - name: Restore NuGet dependencies
        run: dotnet restore Spawn.sln

      - name: Build solution (Release)
        run: dotnet build Spawn.sln -c Release --no-restore -nologo

      - name: Run Architecture IAT & Core test suites (headless, temp-isolated)
        run: dotnet test Spawn.sln -c Release --no-build -nologo --verbosity normal
