name: Documentation

# Keep the job name `docs` in exact sync with the `main-protection` ruleset
# (`required_status_checks`: context = "docs", integration_id = 15368).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Repository Actions allowlist restricts third-party actions to actions/checkout
      # and actions/setup-dotnet; scripts/check_docs.py uses only the Python standard
      # library, so invoke the runner's preinstalled python3 directly.
      - name: Run documentation and hygiene gate
        run: python3 --version && python3 scripts/check_docs.py

      - name: Verify DCO Signed-off-by trailers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          event = os.environ.get("EVENT_NAME", "")
          base = os.environ.get("BASE_SHA", "")
          head = os.environ.get("HEAD_SHA", "")
          dco_re = re.compile(r"^Signed-off-by:\s+.+\s+<[^@\s]+@[^@\s]+>\s*$", re.MULTILINE)

          if event == "pull_request" and base and head:
              revs = subprocess.check_output(
                  ["git", "rev-list", "--no-merges", f"{base}..{head}"],
                  text=True,
              ).splitlines()
          else:
              revs = [subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()]

          if not revs:
              print("No commits found to verify DCO.", file=sys.stderr)
              sys.exit(1)

          missing = []
          for rev in revs:
              msg = subprocess.check_output(["git", "log", "-1", "--format=%B", rev], text=True)
              if not dco_re.search(msg):
                  missing.append(rev)

          if missing:
              print("Missing valid DCO Signed-off-by trailer in commit(s):", ", ".join(missing), file=sys.stderr)
              sys.exit(1)

          print(f"DCO Signed-off-by verified for {len(revs)} commit(s).")
          PY
