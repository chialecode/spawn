# Weekly Release pipeline for SPAWN (ADR-0007 / D-30).
# - Triggers ONLY on Monday 00:00 UTC schedule and manual workflow_dispatch (publish default: false).
# - Never triggered by push or pull_request.
# - Runs ONLY from refs/heads/main: `plan` is gated on github.ref (check/build/publish skip with it)
#   and `publish` re-asserts the main ref; the `release` environment additionally restricts
#   deployment branches to main (issue #9).
# - Top-level permissions are empty; only `publish` holds `contents: write` and only runs when
#   repository variable RELEASE_PUBLISH == '1' (issue #9) and scheduled or explicitly requested.
# - The update-signing private key secret (issue #9) is restricted exclusively to `build`
#   under the `release` environment, written to a random RUNNER_TEMP file, and deleted in `finally`.

name: Weekly Release

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release when RELEASE_PUBLISH=1 is enabled"
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute release plan
        id: plan
        run: python3 -B scripts/release.py --plan

  check:
    name: check
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      DOTNET_CLI_UI_LANGUAGE: "en-US"
      VSLANG: "1033"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore NuGet dependencies
        run: dotnet restore Spawn.sln

      - name: Build solution (Release)
        run: dotnet build Spawn.sln -c Release --no-restore -nologo -nr:false

      - name: Run full .NET test suite (isolated, headless, mute, offline)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gateRoot = Join-Path $env:RUNNER_TEMP ("spawn-gate-" + [guid]::NewGuid().ToString("N"))
          $dataDir = Join-Path $gateRoot "data"
          $vaultDir = Join-Path $gateRoot "vault"
          New-Item -ItemType Directory -Force -Path $dataDir, $vaultDir | Out-Null
          try {
            $tripwire = "http://127.0.0.1:9"
            $env:SPAWN_CHANNEL = "test"
            $env:SPAWN_DATA_DIR = $dataDir
            $env:SPAWN_VAULT_DIR = $vaultDir
            $env:SPAWN_TEST_HEADLESS = "1"
            $env:SPAWN_HEADLESS_TEST = "1"
            $env:SPAWN_MUTE_AUDIO = "1"
            $env:HTTP_PROXY = $tripwire
            $env:HTTPS_PROXY = $tripwire
            $env:ALL_PROXY = $tripwire
            $env:http_proxy = $tripwire
            $env:https_proxy = $tripwire
            $env:all_proxy = $tripwire
            $env:SPAWN_NETWORK_TRIPWIRE = $tripwire
            Remove-Item Env:NO_PROXY, Env:no_proxy -ErrorAction SilentlyContinue

            dotnet test Spawn.sln -c Release --no-build -nologo --verbosity minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $gateRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Run release and packaging tooling unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -B scripts/test_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/test_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify documentation governance and whitespace hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -B scripts/check_docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build:
    name: build
    needs: [plan, check]
    runs-on: windows-2025
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      DOTNET_CLI_UI_LANGUAGE: "en-US"
      VSLANG: "1033"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # The pinned NSIS 3.13 zip (SHA-256 checked) is fetched into .tools/ before the signing key exists.
      - name: Fetch pinned NSIS 3.13
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -B scripts/package.py --fetch-nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build release installer and sign update manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          UPDATE_SIGNING_KEY_PEM: ${{ secrets.UPDATE_SIGNING_KEY_PEM }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY_PEM)) {
            throw "Missing required release environment secret UPDATE_SIGNING_KEY_PEM."
          }
          $keyFile = Join-Path $env:RUNNER_TEMP ("spawn-signing-" + [guid]::NewGuid().ToString("N") + ".pem")
          try {
            $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
            [System.IO.File]::WriteAllText($keyFile, $env:UPDATE_SIGNING_KEY_PEM, $utf8NoBom)
            $env:SPAWN_UPDATE_SIGNING_KEY = $keyFile
            Remove-Item Env:UPDATE_SIGNING_KEY_PEM -ErrorAction SilentlyContinue

            python -B scripts/release.py --build --version $env:RELEASE_VERSION
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item Env:SPAWN_UPDATE_SIGNING_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:UPDATE_SIGNING_KEY_PEM -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $keyFile) {
              Remove-Item -LiteralPath $keyFile -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Run isolated spawn-test install drill
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          python -B scripts/release.py --drill-install --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release bundle completeness
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $bundleDir = "dist/spawn"
          $expected = @(
            "spawn-setup-$($env:RELEASE_VERSION)-x64.exe",
            "spawn-symbols-$($env:RELEASE_VERSION)-x64.zip",
            "update-windows-x64.json",
            "update-windows-x64.json.sig",
            "VERSION.txt",
            "THIRD-PARTY-NOTICES.txt",
            "notes.md",
            "SHA256SUMS"
          )
          foreach ($name in $expected) {
            $full = Join-Path $bundleDir $name
            if (-not (Test-Path -LiteralPath $full) -or (Get-Item -LiteralPath $full).Length -le 0) {
              throw "Missing or empty release bundle artifact: $full"
            }
          }

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spawn-release-${{ needs.plan.outputs.version }}
          path: |
            dist/spawn/spawn-setup-${{ needs.plan.outputs.version }}-x64.exe
            dist/spawn/spawn-symbols-${{ needs.plan.outputs.version }}-x64.zip
            dist/spawn/update-windows-x64.json
            dist/spawn/update-windows-x64.json.sig
            dist/spawn/VERSION.txt
            dist/spawn/THIRD-PARTY-NOTICES.txt
            dist/spawn/notes.md
            dist/spawn/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  publish:
    name: publish
    needs: [plan, build]
    if: github.ref == 'refs/heads/main' && vars.RELEASE_PUBLISH == '1' && (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository for pinned public key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release bundle artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spawn-release-${{ needs.plan.outputs.version }}
          path: release-bundle

      - name: Verify checksums, VERSION.txt, manifest metadata and ECDSA signature
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          test -f release-keys/98ada0750903e1ab.pub.pem

          expected_files=(
            "spawn-setup-${RELEASE_VERSION}-x64.exe"
            "spawn-symbols-${RELEASE_VERSION}-x64.zip"
            "update-windows-x64.json"
            "update-windows-x64.json.sig"
            "VERSION.txt"
            "THIRD-PARTY-NOTICES.txt"
            "notes.md"
            "SHA256SUMS"
          )
          for f in "${expected_files[@]}"; do
            if [[ ! -s "release-bundle/${f}" ]]; then
              echo "Missing or empty downloaded bundle file: ${f}" >&2
              exit 1
            fi
          done

          (cd release-bundle && sha256sum -c SHA256SUMS)

          version_clean="$(tr -d '\r' < release-bundle/VERSION.txt)"
          grep -Fx "channel=release" <<< "$version_clean" >/dev/null
          grep -Fx "version=${RELEASE_VERSION}" <<< "$version_clean" >/dev/null

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_version = os.environ["RELEASE_VERSION"]
          manifest = json.loads(Path("release-bundle/update-windows-x64.json").read_text(encoding="utf-8"))
          assert manifest.get("channel") == "release", f"unexpected channel: {manifest.get('channel')!r}"
          assert manifest.get("version") == expected_version, f"unexpected version: {manifest.get('version')!r}"
          PY

          openssl dgst -sha256 -verify release-keys/98ada0750903e1ab.pub.pem -signature release-bundle/update-windows-x64.json.sig release-bundle/update-windows-x64.json

      - name: Create draft GitHub Release, verify assets, and promote to latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists; refusing to overwrite." >&2
            exit 1
          fi

          gh release create "$tag" \
            "release-bundle/spawn-setup-${RELEASE_VERSION}-x64.exe" \
            "release-bundle/spawn-symbols-${RELEASE_VERSION}-x64.zip" \
            "release-bundle/update-windows-x64.json" \
            "release-bundle/update-windows-x64.json.sig" \
            "release-bundle/VERSION.txt" \
            "release-bundle/THIRD-PARTY-NOTICES.txt" \
            "release-bundle/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$RELEASE_TARGET" \
            --title "SPAWN ${tag}" \
            --notes-file "release-bundle/notes.md"

          uploaded_assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.size > 0) | .name')"
          expected_assets=(
            "spawn-setup-${RELEASE_VERSION}-x64.exe"
            "spawn-symbols-${RELEASE_VERSION}-x64.zip"
            "update-windows-x64.json"
            "update-windows-x64.json.sig"
            "VERSION.txt"
            "THIRD-PARTY-NOTICES.txt"
            "SHA256SUMS"
          )
          for asset in "${expected_assets[@]}"; do
            if ! grep -Fx "$asset" <<< "$uploaded_assets" >/dev/null; then
              echo "Draft release ${tag} is missing verified non-empty asset: ${asset}" >&2
              exit 1
            fi
          done

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
